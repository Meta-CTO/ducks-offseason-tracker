<!doctype html>
<meta charset="utf-8" />
<!-- Source for the favicon set. Rendered at 180x180 by headless Chrome then
     downscaled. An original "AD" monogram; the Ducks logo is a trademark and
     is deliberately not used. -->
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 180px; height: 180px; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0d0c0b;
  }
  .mark {
    width: 180px; height: 180px; border-radius: 38px;
    background:
      radial-gradient(120px 90px at 78% 8%, rgba(207,69,32,0.55), transparent 60%),
      #14100d;
    display: flex; align-items: center; justify-content: center;
  }
  .letters {
    font-family: 'Avenir Next', Avenir, 'Helvetica Neue', Helvetica, sans-serif;
    font-weight: 700;
    font-size: 92px;
    letter-spacing: -0.05em;
    color: #cf4520;
    line-height: 1;
    transform: translateY(-2px);
  }
</style>
<body>
  <div class="mark"><span class="letters">AD</span></div>
</body>
