name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to read-only. The deploy job opts into id-token below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # The page must never ship NHL/Ducks imagery or reference their CDN.
      - name: Check for NHL assets
        run: |
          if grep -rniE "assets\.nhle\.com|nhle\.com/(mugs|logos)|ducks-logo" \
              src/ index.html public/ 2>/dev/null; then
            echo "::error::Found a reference to NHL-hosted imagery."
            exit 1
          fi
          echo "No NHL imagery references found."

      # Every bundled photo must have recorded attribution.
      - name: Check photo attribution
        run: |
          node -e '
            const fs = require("fs");
            const credits = require("./src/data/photo-credits.json");
            const known = new Set(Object.values(credits).map(c => c.file));
            const onDisk = fs.readdirSync("public/headshots");
            const missing = onDisk.filter(f => !known.has(f));
            if (missing.length) {
              console.error("Photos without attribution:", missing.join(", "));
              process.exit(1);
            }
            console.log(`All ${onDisk.length} photos have recorded attribution.`);
          '

  deploy:
    # Only real pushes to main. Never pull requests, which on a public repo can
    # come from forks and must not be able to reach AWS.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://${{ vars.SITE_DOMAIN }}/
    permissions:
      contents: read
      id-token: write # required to request the OIDC token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # TEMPORARY: print the OIDC subject so the trust policy can match it.
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' \
            | awk '{ l=length($0)%4; if(l==2) print $0"=="; else if(l==3) print $0"="; else print $0 }' \
            | base64 -d | jq '{sub, aud, repository, ref, environment, workflow_ref}'

      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Build and deploy
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          # AWS_PROFILE_NAME intentionally unset; credentials come from OIDC.
        run: bash scripts/deploy.sh

      - name: Verify the deployed bundle is the one we just built
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          BUILT=$(ls dist/assets/*.js | head -1 | xargs basename)
          LIVE=$(curl -sS "https://$SITE_DOMAIN/" | grep -oE '/assets/index-[^"]+\.js' | head -1 | xargs basename)
          echo "built: $BUILT"
          echo "live:  $LIVE"
          if [ "$BUILT" != "$LIVE" ]; then
            echo "::error::Live site is serving $LIVE but we built $BUILT."
            exit 1
          fi
          echo "Live site matches the build."
