name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to read-only. The deploy job opts into id-token below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # The page must never ship NHL/Ducks imagery or reference their CDN.
      - name: Check for NHL assets
        run: |
          if grep -rniE "assets\.nhle\.com|nhle\.com/(mugs|logos)|ducks-logo" \
              src/ index.html public/ 2>/dev/null; then
            echo "::error::Found a reference to NHL-hosted imagery."
            exit 1
          fi
          echo "No NHL imagery references found."

      # Every bundled photo must have recorded attribution.
      - name: Check photo attribution
        run: |
          node -e '
            const fs = require("fs");
            const credits = require("./src/data/photo-credits.json");
            const known = new Set(Object.values(credits).map(c => c.file));
            const onDisk = fs.readdirSync("public/headshots");
            const missing = onDisk.filter(f => !known.has(f));
            if (missing.length) {
              console.error("Photos without attribution:", missing.join(", "));
              process.exit(1);
            }
            console.log(`All ${onDisk.length} photos have recorded attribution.`);
          '

  deploy:
    # Only real pushes to main. Never pull requests, which on a public repo can
    # come from forks and must not be able to reach AWS.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://${{ vars.SITE_DOMAIN }}/
    permissions:
      contents: read
      id-token: write # required to request the OIDC token
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The IAM trust policy matches this repo's OIDC subject. Note that the
      # Meta-CTO org emits subjects containing immutable numeric org/repo IDs
      # (repo:Meta-CTO@<id>/ducks-offseason-tracker@<id>:environment:production)
      # rather than the plain-name form shown in most GitHub documentation.
      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Build and deploy
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          # AWS_PROFILE_NAME intentionally unset; credentials come from OIDC.
        run: bash scripts/deploy.sh

      - name: Verify the deployed bundle is the one we just built
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          # index-*.js, not *.js: the bare glob returns an alphabetically-early
          # code-split chunk (ANA-*.js), which never matches the entry bundle
          # scraped from the HTML, so this step failed on every push.
          BUILT=$(ls dist/assets/index-*.js | head -1 | xargs basename)
          LIVE=$(curl -sS "https://$SITE_DOMAIN/" | grep -oE '/assets/index-[^"]+\.js' | head -1 | xargs basename)
          echo "built: $BUILT"
          echo "live:  $LIVE"
          if [ "$BUILT" != "$LIVE" ]; then
            echo "::error::Live site is serving $LIVE but we built $BUILT."
            exit 1
          fi
          echo "Live site matches the build."

  # Second site: nhl.metacto.com, the league-wide platform. Dormant until the
  # NHL_DEPLOY_ENABLED variable is set to 'true', which should happen only once
  # the deploy role has been granted access to the new bucket and distribution
  # (see docs/INFRASTRUCTURE.md) — otherwise this fails with AccessDenied. Verifies
  # against the real domain once DNS resolves, and against the distribution
  # domain before that, so the check is meaningful either way.
  deploy-nhl:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.NHL_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-nhl-production
      cancel-in-progress: false
    # Deliberately the same environment as `deploy`, not a `production-nhl` of
    # its own. The OIDC trust policy allows two subjects only —
    # `:environment:production` and `:ref:refs/heads/main` — so a distinct
    # environment name makes the subject unmatched and the job fails at
    # sts:AssumeRoleWithWebIdentity, before it touches AWS. Giving this site its
    # own environment means adding that subject to the trust policy first.
    environment:
      name: production
      url: https://${{ vars.NHL_SITE_DOMAIN }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Build and deploy
        env:
          SITE_DOMAIN: ${{ vars.NHL_SITE_DOMAIN }}
          S3_BUCKET: ${{ vars.NHL_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.NHL_CLOUDFRONT_DISTRIBUTION_ID }}
        run: bash scripts/deploy.sh

      - name: Verify the deployed bundle is the one we just built
        env:
          SITE_DOMAIN: ${{ vars.NHL_SITE_DOMAIN }}
          DIST_DOMAIN: ${{ vars.NHL_DISTRIBUTION_DOMAIN }}
        run: |
          BUILT=$(ls dist/assets/index-*.js | head -1 | xargs basename)
          TARGET="$SITE_DOMAIN"
          if ! host "$SITE_DOMAIN" >/dev/null 2>&1; then
            echo "::notice::$SITE_DOMAIN does not resolve yet; verifying via $DIST_DOMAIN."
            TARGET="$DIST_DOMAIN"
          fi
          LIVE=$(curl -sS "https://$TARGET/" | grep -oE '/assets/index-[^"]+\.js' | head -1 | xargs basename)
          echo "built: $BUILT"
          echo "live:  $LIVE  (via $TARGET)"
          if [ "$BUILT" != "$LIVE" ]; then
            echo "::error::Live site is serving $LIVE but we built $BUILT."
            exit 1
          fi
          echo "Live site matches the build."
